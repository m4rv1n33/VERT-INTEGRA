# Builds the image and pushes it to GHCR. Runs on GitHub's runners, never a
# self-hosted one: this repository is public, and a self-hosted runner would let
# any pull request from any fork execute code on the home network.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/m4rv1n33/vert
          # The sha tag is what an environment is pinned to; latest is what the
          # server polls for. Both move on every push to main.
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VERT reads its settings at build time and bakes them into the
          # bundle, so these are build args and not runtime environment
          # variables: changing one means rebuilding the image.
          build-args: |
            PUB_ENV=production
            PUB_HOSTNAME=convert.m4rv1n.dev
            PUB_PLAUSIBLE_URL=
            PUB_VERTD_URL=https://vertd.vert.sh
            PUB_DISABLE_ALL_EXTERNAL_REQUESTS=true
            PUB_DONATION_URL=
            PUB_STRIPE_KEY=
          cache-from: type=gha
          cache-to: type=gha,mode=max
